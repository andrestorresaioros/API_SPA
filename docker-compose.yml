services:
  db:
    image: postgres:16-alpine
    container_name: api_spa_postgres
    environment:
      POSTGRES_DB: catalog_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d catalog_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    image: mcr.microsoft.com/dotnet/sdk:8.0
    working_dir: /workspace
    volumes:
      - ./:/workspace
    environment:
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=catalog_db;Username=postgres;Password=postgres
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        dotnet tool install --global dotnet-ef --version 8.0.8
        /root/.dotnet/tools/dotnet-ef database update --project src/Infrastructure --startup-project src/Api
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - tools

  api:
    build:
      context: .
      dockerfile: src/Api/Dockerfile
    container_name: api_spa_api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=catalog_db;Username=postgres;Password=postgres
      Cors__AllowedOrigins__0: http://localhost:5173
      Cors__AllowedOrigins__1: http://localhost:3000
      Cors__AllowedOrigins__2: http://localhost:8081
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8080
    container_name: api_spa_frontend
    ports:
      - "8081:80"
    depends_on:
      api:
        condition: service_started

volumes:
  postgres_data:
