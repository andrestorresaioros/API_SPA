name: ci

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  backend-build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore API_SPA.sln

      - name: Build
        run: dotnet build API_SPA.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test API_SPA.sln --configuration Release --no-build

  frontend-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  docker-build-validation:
    runs-on: ubuntu-latest
    needs:
      - backend-build-and-test
      - frontend-build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate docker compose
        run: docker compose config

      - name: Build API Docker image
        run: docker build -f src/Api/Dockerfile -t api-spa-api:ci .

      - name: Build frontend Docker image
        run: docker build -f frontend/Dockerfile --build-arg VITE_API_BASE_URL=http://localhost:8080 -t api-spa-frontend:ci ./frontend
